<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Zynora Design Tokens — Demo</title>
<link rel="stylesheet" href="../frontend/src/styles/tokens.css">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 3rem 1.5rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2.5rem;
  }
  .wordmark {
    font-size: 2.5rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--color-text);
  }
  .wordmark span { color: var(--color-accent); }
  .tagline {
    color: var(--color-accent);
    letter-spacing: 0.3em;
    font-size: 0.75rem;
    text-transform: uppercase;
    margin-top: -1.5rem;
  }
  .swatches {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    justify-content: center;
  }
  .swatch {
    width: 140px;
    padding: 1rem;
    border-radius: 8px;
    border: 1px solid var(--color-border);
    font-size: 0.75rem;
    color: var(--color-text-muted);
  }
  .swatch-color {
    height: 60px;
    border-radius: 4px;
    margin-bottom: 0.5rem;
  }
  .card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 12px;
    padding: 2rem;
    max-width: 400px;
    box-shadow: var(--shadow-glow-sm);
  }
  .card h3 { color: var(--color-text); margin-top: 0; }
  .card p { color: var(--color-text-muted); font-size: 0.9rem; line-height: 1.5; }
  .btn {
    background: var(--color-accent);
    color: var(--zynora-text-on-cyan);
    border: none;
    padding: 0.75rem 2rem;
    border-radius: 999px;
    font-weight: 600;
    letter-spacing: 0.05em;
    cursor: pointer;
    box-shadow: var(--shadow-glow-md);
    transition: box-shadow 0.2s, background 0.2s;
  }
  .btn:hover { background: var(--color-accent-hover); box-shadow: var(--shadow-glow-lg); }
  .btn:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 3px; }
</style>
</head>
<body>

  <div>
    <div class="wordmark">ZYNORA<span>.</span></div>
    <div class="tagline">Innovate. Integrate. Elevate.</div>
  </div>

  <div class="swatches">
    <div class="swatch">
      <div class="swatch-color" style="background: var(--zynora-black); border: 1px solid #222;"></div>
      Black<br>#000000
    </div>
    <div class="swatch">
      <div class="swatch-color" style="background: var(--zynora-white);"></div>
      White<br>#FFFFFF
    </div>
    <div class="swatch">
      <div class="swatch-color" style="background: var(--zynora-cyan);"></div>
      Cyan<br>#00EEFD
    </div>
    <div class="swatch">
      <div class="swatch-color" style="background: var(--zynora-surface-1);"></div>
      Surface<br>#0A0D12
    </div>
  </div>

  <div class="card">
    <h3>Factorisation</h3>
    <p>Mastery: 42% — needs support. This card demonstrates surface, border,
    text, and glow tokens together as they'd appear in the actual tutor UI.</p>
    <button class="btn">Start practicing</button>
  </div>

</body>
</html>
