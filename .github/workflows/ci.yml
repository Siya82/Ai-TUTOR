# NEW 17 Nov 2026 (code review #18). Runs on every push and pull request:
# backend tests plus a full migrate up/down/up against a real Postgres with
# pgvector, and the frontend lint + build. No secrets needed -- the tests
# never call the real Claude API (live_api tests are excluded in pytest.ini).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: caps_tutor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/caps_tutor
      # code review 19 Nov #4: the HTTP permission tests run against the same
      # throwaway CI database (locally they need their own -- see
      # tests/integration/conftest.py)
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/caps_tutor
      ANTHROPIC_API_KEY: ci-placeholder
      JWT_SECRET_KEY: ci-only-not-a-real-secret
      ENVIRONMENT: ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pyflakes pip-audit
      - name: Migrations (up, down one, up)
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
      - name: Unused imports / undefined names
        run: python -m pyflakes app scripts tests
      - name: Tests
        run: python -m pytest -q
      # deep scan H2: fail the build if a dependency has a known vulnerability
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Dependency audit (what ships to users)
        run: npm audit --omit=dev --audit-level=moderate
      - run: npx eslint src
      - run: npm test
      - run: npx vite build
